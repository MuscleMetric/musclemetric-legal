<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F9FAFB" />
<meta name="color-scheme" content="light dark" />
<title>{{ page.seo_title }}</title>
<meta name="description" content="{{ page.seo_description }}" />
<meta name="author" content="Harry Cunningham" />
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
<link rel="canonical" href="https://musclemetric.github.io/musclemetric-legal/{{ page.canonical_path }}" />
<meta property="og:site_name" content="MuscleMetrics" />
<meta property="og:locale" content="en_GB" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://musclemetric.github.io/musclemetric-legal/{{ page.canonical_path }}" />
<meta property="og:title" content="{{ page.seo_title }}" />
<meta property="og:description" content="{{ page.seo_description }}" />
<meta property="og:image" content="https://raw.githubusercontent.com/MuscleMetric/frontend/main/assets/icon.png" />
<meta property="og:image:alt" content="MuscleMetrics app logo" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page.seo_title }}" />
<meta name="twitter:description" content="{{ page.seo_description }}" />
<meta name="twitter:image" content="https://raw.githubusercontent.com/MuscleMetric/frontend/main/assets/icon.png" />
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
<style>
  .seo-hero{padding:150px 0 72px}.seo-hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:64px;align-items:center}.seo-hero h1{font-size:clamp(2.7rem,6vw,5.3rem);line-height:.98;letter-spacing:-.055em;margin:18px 0 24px;max-width:900px}.seo-hero p{font-size:1.12rem;line-height:1.75;color:var(--muted);max-width:720px}.seo-side-card{padding:28px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 24px 70px rgba(15,23,42,.08)}.seo-side-card h2{font-size:1.1rem;margin:0 0 18px}.seo-side-card ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}.seo-side-card li{display:flex;gap:12px;align-items:flex-start;color:var(--muted);line-height:1.5}.seo-side-card li::before{content:'✓';width:24px;height:24px;border-radius:50%;background:rgba(34,197,94,.12);color:#16A34A;display:grid;place-items:center;font-weight:700;flex:0 0 auto}.seo-section{padding:84px 0}.seo-section.alt{background:color-mix(in srgb,var(--surface) 58%,var(--bg))}.seo-copy{max-width:850px}.seo-copy h2{font-size:clamp(2rem,4vw,3.25rem);letter-spacing:-.04em;margin:0 0 22px}.seo-copy p{color:var(--muted);line-height:1.8;font-size:1.03rem}.seo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}.seo-card{padding:26px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}.seo-card h3{margin:12px 0 10px}.seo-card p{margin:0;color:var(--muted);line-height:1.65}.seo-links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}.seo-link-card{display:block;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-decoration:none;color:var(--text);font-weight:700}.seo-link-card span{display:block;color:var(--muted);font-weight:500;font-size:.9rem;margin-top:7px;line-height:1.5}@media(max-width:820px){.seo-hero{padding-top:120px}.seo-hero-grid,.seo-grid,.seo-links{grid-template-columns:1fr}.seo-hero-grid{gap:32px}}
</style>
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebPage",
  "name":{{ page.seo_title | jsonify }},
  "description":{{ page.seo_description | jsonify }},
  "url":"https://musclemetric.github.io/musclemetric-legal/{{ page.canonical_path }}",
  "isPartOf":{"@type":"WebSite","name":"MuscleMetrics","url":"https://musclemetric.github.io/musclemetric-legal/"},
  "about":{"@type":"MobileApplication","name":"MuscleMetrics","alternateName":"MuscleMetric","operatingSystem":"iOS","url":"https://musclemetric.github.io/musclemetric-legal/","downloadUrl":"https://apps.apple.com/us/app/musclemetrics/id6755702103"}
}
</script>
